name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  NODE_VERSION: "20"

jobs:
  # ── Lint + Type Check + Build Jobs ─────────────────────────────
  check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type check (Next.js)
        run: npm run typecheck

      - name: Build jobs (worker + scheduler)
        run: npm run build:jobs

  # ── Build Docker image ─────────────────────────────────────────
  build:
    name: Docker Build
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          tags: |
            ghcr.io/johnydeev/ia-drive-doc-processor:latest
            ghcr.io/johnydeev/ia-drive-doc-processor:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy (solo en push a master, self-hosted runner) ─────────
  deploy:
    name: Deploy
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: self-hosted
    env:
      # Config de Docker propio del job (limpio, sin el credential helper de
      # Docker Desktop). Evita el error "A specified logon session does not exist"
      # del credsStore=desktop, que falla en el runner sin sesión interactiva (y
      # que Docker Desktop re-agrega al config global, por eso editarlo a mano no
      # alcanza). Aplica a login + pull + compose de todo el job.
      # NOTA: el contexto `runner` NO está disponible en `env` a nivel de job →
      # se usa `github.workspace` (sí disponible). El dir se crea en el step de abajo.
      DOCKER_CONFIG: ${{ github.workspace }}/.docker-ci
    steps:
      - uses: actions/checkout@v4

      # Login a GHCR SIN `docker login` ni credential helper: se escribe el auth
      # (base64 de usuario:token) directamente en un config.json propio del job.
      # Evita el error "A specified logon session does not exist" del helper de
      # Windows (que falla en el runner sin sesión interactiva, y que el
      # login-action no esquiva ni con DOCKER_CONFIG — runner-images #11211), y
      # también el problema del CRLF del pipe a --password-stdin en PowerShell 5.1.
      # docker pull/compose leen este config vía DOCKER_CONFIG (env del job). El
      # GITHUB_TOKEN es efímero (expira al terminar el job).
      - name: Prepare Docker config with GHCR auth (no credential helper)
        shell: powershell
        env:
          GHCR_USER: johnydeev
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path $env:DOCKER_CONFIG | Out-Null
          $pair = "{0}:{1}" -f $env:GHCR_USER, $env:GHCR_TOKEN
          $auth = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($pair))
          $cfg = @{ auths = @{ "ghcr.io" = @{ auth = $auth } } } | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText((Join-Path $env:DOCKER_CONFIG "config.json"), $cfg)
          Write-Host "Auth de ghcr.io escrito en $env:DOCKER_CONFIG (sin helper, sin docker login)"

      # Crítica #3: el .env viene desde secrets.PROD_ENV_FILE (GitHub Secret),
      # en vez de copiarse desde un path hardcodeado en el runner. Requiere
      # configurar el secret en Settings → Secrets and variables → Actions.
      - name: Write env file from GitHub Secret
        shell: powershell
        env:
          PROD_ENV: ${{ secrets.PROD_ENV_FILE }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:PROD_ENV)) {
            Write-Host "::error::Secret 'PROD_ENV_FILE' no esta configurado en el repositorio."
            Write-Host "Configurarlo en: Settings -> Secrets and variables -> Actions -> New repository secret"
            exit 1
          }
          # WriteAllText evita BOM y normaliza newlines; docker compose tolera CRLF en env_file
          [System.IO.File]::WriteAllText("$PWD\.env", $env:PROD_ENV)
          $lines = (Get-Content .env | Measure-Object -Line).Lines
          Write-Host "::notice::.env escrito desde secret ($lines lineas)"

      # (El login a GHCR ya está resuelto arriba escribiendo el auth en el
      # config.json del job — sin `docker login` ni credential helper.)

      # Exporta los logs de los containers actuales a ./logs/ antes de tirarlos
      # abajo. Si el deploy revienta o un worker tira un stack útil, el siguiente
      # `up --force-recreate` borra el container y sus logs — esta exportación
      # los conserva. El script existe desde antes (uso manual con
      # `pwsh scripts/export-logs.ps1`).
      # Best-effort: si los containers no existen (primer deploy, runner limpio,
      # etc.) el script puede no producir nada y no debe abortar el deploy.
      - name: Export current logs before rebuild
        shell: powershell
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          if (Test-Path .\scripts\export-logs.ps1) {
            & .\scripts\export-logs.ps1 -Since 72h
          } else {
            Write-Host "::warning::scripts/export-logs.ps1 no encontrado; salto exportación."
          }

      # Sube los .txt como artifact para que queden disponibles en la run de GHA
      # aunque el runner se reinicie o se borre ./logs/ en el próximo deploy.
      # Retención corta (14 días) — los logs ya viven también en el runner.
      - name: Upload logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-logs-${{ github.sha }}
          path: logs/*.txt
          if-no-files-found: ignore
          retention-days: 14

      # Crítica #1: aborta el script si cualquier comando falla. PowerShell con
      # $ErrorActionPreference='Stop' solo cubre cmdlets — los exit codes de
      # native commands (docker, npx) hay que chequearlos manualmente con
      # $LASTEXITCODE. Sin esto, un migrate deploy fallido no impedia que se
      # levantaran containers con codigo nuevo contra DB vieja (silent failure).
      - name: Build and restart
        shell: powershell
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-Step {
            param([string]$Name, [scriptblock]$Body)
            Write-Host "==> $Name"
            & $Body
            if ($LASTEXITCODE -ne 0) { throw "$Name failed with exit code $LASTEXITCODE" }
          }

          # Limpieza ANTES del pull: es donde falta el espacio. El 2026-08-20 el
          # deploy murió con "no space left on device" extrayendo una capa, con 31
          # imágenes ocupando 65 GB de las cuales 28 no las usaba nadie.
          #
          # `-a` es la clave: sin él sólo se borran las imágenes COLGADAS (sin tag),
          # y las de cada deploy quedan tageadas con su SHA, así que nunca se
          # limpiaban. El filtro de antigüedad deja los últimos 7 días para poder
          # volver atrás a una imagen anterior si un deploy sale mal.
          #
          # Las imágenes EN USO están protegidas: Docker no borra una que tenga un
          # contenedor asociado, ni corriendo ni parado. Acá los contenedores todavía
          # corren la versión anterior, así que esa imagen no se toca.
          Invoke-Step "docker cleanup (antes del pull)" {
            docker image prune -a -f --filter "until=168h"
            docker builder prune -f --filter "until=168h"
          }

          Invoke-Step "docker pull" {
            docker pull "ghcr.io/johnydeev/ia-drive-doc-processor:${env:IMAGE_TAG}"
          }
          Invoke-Step "docker tag :latest" {
            docker tag "ghcr.io/johnydeev/ia-drive-doc-processor:${env:IMAGE_TAG}" "ghcr.io/johnydeev/ia-drive-doc-processor:latest"
          }
          Invoke-Step "prisma migrate deploy" {
            docker compose -p ia-drive-doc-processor run --rm web npx prisma migrate deploy
          }
          Invoke-Step "docker compose up" {
            docker compose -p ia-drive-doc-processor up -d --force-recreate
          }
          # Limpieza posterior: ahora que los contenedores corren la imagen nueva, la
          # anterior quedó libre. Mismo filtro de 7 días para conservar el margen de
          # rollback.
          Invoke-Step "docker image prune" {
            docker image prune -a -f --filter "until=168h"
          }

      - name: Wait for healthy (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "Waiting for web to be healthy..."
          for i in $(seq 1 30); do
            if docker compose -p ia-drive-doc-processor ps web | grep -q "healthy"; then
              echo "Web is healthy!"
              exit 0
            fi
            sleep 5
          done
          echo "Web did not become healthy in time"
          docker compose -p ia-drive-doc-processor logs web --tail 20
          exit 1

      - name: Wait for healthy (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Write-Host "Waiting for web to be healthy..."
          $healthy = $false
          for ($i = 1; $i -le 30; $i++) {
            $status = docker compose -p ia-drive-doc-processor ps web
            if ($status -match "healthy") {
              Write-Host "Web is healthy!"
              $healthy = $true
              break
            }
            Start-Sleep -Seconds 5
          }
          if (-not $healthy) {
            Write-Host "Web did not become healthy in time"
            docker compose -p ia-drive-doc-processor logs web --tail 20
            exit 1
          }
